name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # ─── 1. CODE QUALITY: Lint & Test ──────────────────────────────────────────
  code-quality:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      # Backend Checks
      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm install
        
      - name: Lint Backend
        working-directory: ./backend
        run: npm run lint
        
      - name: Test Backend
        working-directory: ./backend
        run: npm run test

      # Frontend Checks
      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm install
        
      - name: Lint Frontend
        working-directory: ./frontend
        run: npm run lint
        
      - name: Test Frontend
        working-directory: ./frontend
        run: npm run test

  # ─── 2. DOCKER BUILD & SCAN ──────────────────────────────────────────────
  docker-build-scan:
    name: Build & Scan Docker Images
    runs-on: ubuntu-latest
    needs: code-quality # Wait for tests to pass
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build Backend
      - name: Build Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          load: true
          tags: local/deal-aggregator-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Scan Backend with Trivy
      - name: Scan Backend Image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'local/deal-aggregator-backend:latest'
          format: 'table'
          exit-code: '0' # Set to 1 to fail the build on vulnerabilities
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      # Build Frontend
      - name: Build Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: false
          load: true
          tags: local/deal-aggregator-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Scan Frontend with Trivy
      - name: Scan Frontend Image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'local/deal-aggregator-frontend:latest'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      # Build Scraper
      - name: Build Scraper Image
        uses: docker/build-push-action@v5
        with:
          context: ./scraper
          push: false
          load: true
          tags: local/deal-aggregator-scraper:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─── 3. DOCKER PUSH (Runs only if secrets are set) ──────────────────────
  docker-push:
    name: Push to Docker Hub
    runs-on: ubuntu-latest
    needs: docker-build-scan
    # Only run if Docker Hub username is configured
    if: ${{ github.event_name == 'push' }}
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Backend Push
      - name: Build and Push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/deal-aggregator-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/deal-aggregator-backend:${{ github.sha }}

      # Frontend Push
      - name: Build and Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/deal-aggregator-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/deal-aggregator-frontend:${{ github.sha }}

      # Scraper Push
      - name: Build and Push Scraper
        uses: docker/build-push-action@v5
        with:
          context: ./scraper
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/deal-aggregator-scraper:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/deal-aggregator-scraper:${{ github.sha }}

  # ─── 4. CONTINUOUS DEPLOYMENT (CD) TO EC2 ───────────────────────────────
  deploy-to-ec2:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: docker-push
    if: ${{ github.event_name == 'push' }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Copy docker-compose.prod.yml to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "docker-compose.prod.yml"
          target: "/home/${{ secrets.EC2_USERNAME }}/deal-aggregator"

      - name: Pull Images and Restart Containers
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/${{ secrets.EC2_USERNAME }}/deal-aggregator
            # Pull latest images from Docker Hub
            docker compose -f docker-compose.prod.yml pull
            # Restart services with the new images
            docker compose -f docker-compose.prod.yml up -d
