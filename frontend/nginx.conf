server {
    # Unprivileged port — the nginx-unprivileged image does not run as root,
    # so it cannot bind to ports below 1024
    listen 8080;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Don't advertise the nginx version in headers or error pages
    server_tokens off;

    # ─── Security headers ────────────────────────────────────────────────────
    # "always" = also send them on 4xx/5xx responses.
    # Note: nginx only inherits add_header into a location block if that
    # location defines no add_header of its own — so locations below avoid it.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # CSP: only load scripts from our own origin. Fonts come from Google Fonts and
    # brand logos from logo.clearbit.com, so those are allow-listed explicitly.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://logo.clearbit.com; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

    # Enable Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Single Page Application (SPA) routing fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite emits content-hashed filenames, so these can be cached for a long time
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # Prometheus metrics are for internal scraping only (Prometheus talks to
    # backend:5000 directly) — never expose them to the public internet
    location = /api/metrics {
        return 404;
    }

    # API proxying to the backend service (Docker network / K8s ClusterIP)
    location /api/ {
        proxy_pass http://backend:5000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Pass the real client IP — the backend trusts one proxy hop and uses
        # this for per-client rate limiting
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
