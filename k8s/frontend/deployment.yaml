apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: deal-aggregator
  labels:
    app: frontend
    tier: presentation
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
        tier: presentation
    spec:
      containers:
        - name: frontend
          # Replace with GHCR image in Phase 6
          # e.g. ghcr.io/<your-github-username>/deal-aggregator-frontend:latest
          image: deal-aggregator-frontend:latest
          imagePullPolicy: Never     # Minikube local image cache
          ports:
            - containerPort: 80

          # Nginx is stateless — a simple TCP readiness check is sufficient
          readinessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 20

          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"
