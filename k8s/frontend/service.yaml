apiVersion: v1
kind: Service
metadata:
  name: deal-aggregator-frontend
  namespace: deal-aggregator
  labels:
    app: frontend
    tier: presentation
spec:
  selector:
    app: frontend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
      nodePort: 30080       # fixed nodePort so the URL stays stable between restarts
  # NodePort exposes the frontend on every Minikube node's IP:30080
  # Access via: minikube service deal-aggregator-frontend -n deal-aggregator
  # Or:         http://$(minikube ip):30080
  type: NodePort
