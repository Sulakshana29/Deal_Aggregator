apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: deal-aggregator
  labels:
    app: backend
data:
  # Non-sensitive runtime configuration for the Express API
  PORT: "5000"
  # "mongodb" resolves to the mongodb ClusterIP Service inside the cluster
  MONGO_URI: "mongodb://mongodb:27017/deal-aggregator"
  # Phase 4 (Minikube): The frontend is accessed via the Minikube node IP.
  # We use * here so CORS doesn't block during local learning.
  # Phase 5 will lock this down to the real Ingress hostname.
  CLIENT_ORIGIN: "*"
