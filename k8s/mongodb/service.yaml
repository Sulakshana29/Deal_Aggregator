apiVersion: v1
kind: Service
metadata:
  name: mongodb              # backend uses "mongodb" hostname in MONGO_URI
  namespace: deal-aggregator
  labels:
    app: mongodb
    tier: database
spec:
  selector:
    app: mongodb
  ports:
    - protocol: TCP
      port: 27017
      targetPort: 27017
  # ClusterIP = only accessible inside the cluster (no external exposure)
  type: ClusterIP
