apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mongodb-pvc
  namespace: deal-aggregator
  labels:
    app: mongodb
spec:
  # Minikube provides a default StorageClass (standard) — no provisioner needed
  accessModes:
    - ReadWriteOnce       # single node read-write (fine for a learning cluster)
  resources:
    requests:
      storage: 1Gi        # 1 GB is plenty for dev data
