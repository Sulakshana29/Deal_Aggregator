apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Local learning cluster (Minikube / Docker Desktop / k3d).
# Build images into the cluster's Docker daemon first:
#   minikube start --cni=calico            # calico enforces NetworkPolicies
#   minikube docker-env | Invoke-Expression   # PowerShell  (bash: eval $(minikube docker-env))
#   docker build -t deal-aggregator-backend:latest  ./backend
#   docker build -t deal-aggregator-frontend:latest ./frontend
#   docker build -t deal-aggregator-scraper:latest  ./scraper
#   kubectl apply -k k8s/overlays/local
#   minikube service deal-aggregator-frontend -n deal-aggregator

resources:
  - ../../base

# DEV-ONLY credentials (throwaway, local cluster). Kustomize appends a content hash to
# the Secret name and rewrites every reference, so changing a value rolls the pods.
# Real environments must NOT commit secrets (Sealed Secrets / External Secrets, later).
secretGenerator:
  - name: mongodb-credentials
    namespace: deal-aggregator
    literals:
      - username=dealvault
      - password=local-dev-only-password

patches:
  # Expose the frontend on a fixed NodePort for browser access
  - path: frontend-nodeport.yaml
