apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: deal-aggregator
  labels:
    app: backend
data:
  # Non-sensitive runtime configuration. MONGO_URI is built in the Deployment from
  # the mongodb-credentials Secret, so no password lives in a ConfigMap.
  PORT: "5000"
  CLIENT_ORIGIN: "*"        # overlays tighten this for real environments
