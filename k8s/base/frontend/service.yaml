apiVersion: v1
kind: Service
metadata:
  name: deal-aggregator-frontend
  namespace: deal-aggregator
  labels:
    app: frontend
    tier: presentation
spec:
  selector:
    app: frontend
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 8080      # container port of nginx-unprivileged
  # ClusterIP in the base. How it is exposed is an environment decision:
  #   overlays/local   → NodePort 30080 (Minikube)
  #   overlays/ci-kind → kubectl port-forward
  type: ClusterIP
