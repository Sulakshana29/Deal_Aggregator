apiVersion: v1
kind: Service
metadata:
  name: mongodb              # apps connect to the hostname "mongodb", same as docker-compose
  namespace: deal-aggregator
  labels:
    app: mongodb
    tier: database
spec:
  # Headless: no virtual IP. DNS returns the pod IP directly, and each StatefulSet
  # pod also gets its own record (mongodb-0.mongodb). Required by serviceName.
  clusterIP: None
  selector:
    app: mongodb
  ports:
    - name: mongo
      protocol: TCP
      port: 27017
      targetPort: 27017
