apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongodb
  namespace: deal-aggregator
  labels:
    app: mongodb
    tier: database
spec:
  # Must match the headless Service in service.yaml — gives the pod a stable DNS
  # name (mongodb-0.mongodb.deal-aggregator.svc.cluster.local)
  serviceName: mongodb
  replicas: 1
  selector:
    matchLabels:
      app: mongodb
  template:
    metadata:
      labels:
        app: mongodb
        tier: database
    spec:
      # ── Pod-level security (required by Pod Security Standard "restricted") ──
      securityContext:
        runAsNonRoot: true
        runAsUser: 999          # the "mongodb" user baked into the official image
        runAsGroup: 999
        fsGroup: 999            # K8s chowns the mounted volume to this group
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mongodb
          image: mongo:9.0.2    # same pinned version as docker-compose
          ports:
            - name: mongo
              containerPort: 27017
          env:
            # Same variables docker-compose uses. They only take effect on the
            # FIRST start with an empty volume (creates the root user + enables auth).
            - name: MONGO_INITDB_ROOT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: mongodb-credentials
                  key: username
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mongodb-credentials
                  key: password
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            # mongod writes to several paths in the image, so the root FS stays
            # writable here. App containers (backend/frontend/scraper) are read-only.
            readOnlyRootFilesystem: false
          volumeMounts:
            - name: data
              mountPath: /data/db
          readinessProbe:
            exec:
              command: ["mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 5
          livenessProbe:
            exec:
              command: ["mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
  # Each replica gets its OWN PersistentVolumeClaim (data-mongodb-0, ...), which
  # survives pod restarts and is re-attached to the same pod index.
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
