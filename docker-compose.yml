services:
  # ─── 1. Database Tier: MongoDB ──────────────────────────────────────────────
  mongodb:
    image: mongo:9.0.2                 # pinned version — :latest can silently jump versions
    container_name: deal-aggregator-db
    restart: always
    environment:
      # Creates the root user on FIRST start (empty volume only) and enables auth
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_USERNAME:?set MONGO_USERNAME in .env}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASSWORD:?set MONGO_PASSWORD in .env}
    ports:
      - "127.0.0.1:27017:27017"      # localhost only — reachable by Compass, not the LAN
    volumes:
      - mongo-data:/data/db
    networks:
      - deal-network
    healthcheck:
      # mongosh exits 0 when the server accepts connections
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ─── 2. Application Tier: Node.js Express API ───────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: deal-aggregator-backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://${MONGO_USERNAME}:${MONGO_PASSWORD}@mongodb:27017/deal-aggregator?authSource=admin
      - CLIENT_ORIGIN=http://localhost:3000
    depends_on:
      mongodb:
        condition: service_healthy   # waits for real DB readiness, not just container start
    networks:
      - deal-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ─── 3. Presentation Tier: React Vite UI served via Nginx ───────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: deal-aggregator-frontend
    restart: always
    ports:
      - "3000:8080"                  # nginx-unprivileged listens on 8080
    depends_on:
      backend:
        condition: service_healthy   # waits for API to be ready before frontend starts
    networks:
      - deal-network

  # ─── 4. Scraper: one-shot job (run manually or on a schedule) ───────────────
  # Usage: docker compose --profile scraper run --rm scraper
  scraper:
    build:
      context: ./scraper
      dockerfile: Dockerfile
    container_name: deal-aggregator-scraper
    profiles:
      - scraper                      # not started by default with `docker compose up`
    environment:
      - MONGO_URI=mongodb://${MONGO_USERNAME}:${MONGO_PASSWORD}@mongodb:27017/deal-aggregator?authSource=admin
      - RETRY_DELAY_MS=3000
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - deal-network
    restart: "no"                    # one-shot — exit after scrape completes

  # ─── 5. Monitoring: Prometheus ───────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v3.15.0
    container_name: deal-aggregator-prometheus
    restart: always
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - deal-network

  # ─── 6. Monitoring: Grafana ──────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:13.2.3
    container_name: deal-aggregator-grafana
    restart: always
    ports:
      - "3001:3000" # Expose Grafana on 3001 to avoid conflicting with frontend dev server
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}   # "admin" fallback is for local dev only
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - deal-network

  # ─── 7. Monitoring: cAdvisor (Docker Container Metrics) ──────────────────────
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: deal-aggregator-cadvisor
    restart: always
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    ports:
      - "8080:8080"
    networks:
      - deal-network

# ─── Persistent Volumes & Virtual Networks ────────────────────────────────────
volumes:
  mongo-data:
  prometheus-data:
  grafana-data:

networks:
  deal-network:
    driver: bridge
