services:
  # ─── 1. Database Tier: MongoDB ──────────────────────────────────────────────
  mongodb:
    image: mongo:latest
    container_name: deal-aggregator-db
    restart: always
    # No ports exposed (this part was good!)
    volumes:
      - mongo-data:/data/db
    networks:
      - deal-network
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ─── 2. Application Tier: Node.js Express API ───────────────────────────────
  backend:
    image: dockersula/deal-aggregator-backend:latest
    container_name: deal-aggregator-backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/deal-aggregator
      # Hardcode EC2 public IP or domain later, but for now we allow anything for demo
      - CLIENT_ORIGIN=*
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - deal-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ─── 3. Presentation Tier: React Vite UI served via Nginx ───────────────────
  frontend:
    image: dockersula/deal-aggregator-frontend:latest
    container_name: deal-aggregator-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - deal-network

  # ─── 4. Scraper: one-shot job (run manually or on a schedule) ───────────────
  scraper:
    image: dockersula/deal-aggregator-scraper:latest
    container_name: deal-aggregator-scraper
    profiles:
      - scraper
    environment:
      - MONGO_URI=mongodb://mongodb:27017/deal-aggregator
      - RETRY_DELAY_MS=3000
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - deal-network
    restart: "no"

  # ─── 5. Monitoring: Prometheus ───────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: deal-aggregator-prometheus
    restart: always
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - deal-network

  # ─── 6. Monitoring: Grafana ──────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    container_name: deal-aggregator-grafana
    restart: always
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - deal-network

  # ─── 7. Monitoring: cAdvisor (Docker Container Metrics) ──────────────────────
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: deal-aggregator-cadvisor
    restart: always
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    ports:
      - "8080:8080"
    networks:
      - deal-network

  # ─── 8. Logging: Loki (Log Storage) ─────────────────────────────────────────
  loki:
    image: grafana/loki:3.0.0
    container_name: deal-aggregator-loki
    restart: always
    ports:
      - "3100:3100"
    volumes:
      - ./loki/loki-config.yml:/etc/loki/loki-config.yml
      - loki-data:/loki
    command: -config.file=/etc/loki/loki-config.yml
    networks:
      - deal-network

  # ─── 9. Logging: Promtail (Log Collector/Agent) ───────────────────────────────
  promtail:
    image: grafana/promtail:3.0.0
    container_name: deal-aggregator-promtail
    restart: always
    volumes:
      - ./loki/promtail-config.yml:/etc/promtail/promtail-config.yml
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/promtail-config.yml
    depends_on:
      - loki
    networks:
      - deal-network

volumes:
  mongo-data:
  prometheus-data:
  grafana-data:
  loki-data:

networks:
  deal-network:
    driver: bridge
