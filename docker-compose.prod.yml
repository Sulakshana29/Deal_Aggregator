services:
  # ─── 1. Database Tier: MongoDB ──────────────────────────────────────────────
  mongodb:
    image: mongo:9.0.2                 # pinned version — :latest can silently jump versions
    container_name: deal-aggregator-db
    restart: always
    # No ports exposed — only reachable on the internal Docker network
    environment:
      # Creates the root user on FIRST start (empty volume only) and enables auth
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_USERNAME:?set MONGO_USERNAME in .env}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASSWORD:?set MONGO_PASSWORD in .env}
    volumes:
      - mongo-data:/data/db
    networks:
      - deal-network
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ─── 2. Application Tier: Node.js Express API ───────────────────────────────
  backend:
    image: dockersula/deal-aggregator-backend:latest
    container_name: deal-aggregator-backend
    restart: always
    # No public port — the API is reached only through the frontend nginx proxy (/api/)
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://${MONGO_USERNAME}:${MONGO_PASSWORD}@mongodb:27017/deal-aggregator?authSource=admin
      # Hardcode EC2 public IP or domain later, but for now we allow anything for demo
      - CLIENT_ORIGIN=*
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - deal-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ─── 3. Presentation Tier: React Vite UI served via Nginx ───────────────────
  frontend:
    image: dockersula/deal-aggregator-frontend:latest
    container_name: deal-aggregator-frontend
    restart: always
    ports:
      - "80:8080"                    # nginx-unprivileged listens on 8080
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - deal-network

  # ─── 4. Scraper: one-shot job (run manually or on a schedule) ───────────────
  scraper:
    image: dockersula/deal-aggregator-scraper:latest
    container_name: deal-aggregator-scraper
    profiles:
      - scraper
    environment:
      - MONGO_URI=mongodb://${MONGO_USERNAME}:${MONGO_PASSWORD}@mongodb:27017/deal-aggregator?authSource=admin
      - RETRY_DELAY_MS=3000
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - deal-network
    restart: "no"

  # ─── 5. Monitoring: Prometheus ───────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v3.15.0
    container_name: deal-aggregator-prometheus
    restart: always
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    # No public port — Grafana queries it over the internal network
    networks:
      - deal-network

  # ─── 6. Monitoring: Grafana ──────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:13.2.3
    container_name: deal-aggregator-grafana
    restart: always
    ports:
      # Bound to localhost only — open it via an SSH tunnel:
      #   ssh -L 3001:localhost:3001 <user>@<ec2-host>  → http://localhost:3001
      - "127.0.0.1:3001:3000"
    environment:
      # Required — compose refuses to start with no password (no "admin" default)
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:?set GRAFANA_PASSWORD in .env}
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - deal-network

  # ─── 7. Monitoring: cAdvisor (Docker Container Metrics) ──────────────────────
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: deal-aggregator-cadvisor
    restart: always
    privileged: true
    command:
      - '--docker_only=true'
      - '--housekeeping_interval=10s'
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:rw
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    # No public port — scraped by Prometheus over the internal network
    networks:
      - deal-network
      
  # ─── 8. Logging: Loki (Log Storage) ─────────────────────────────────────────
  loki:
    image: grafana/loki:3.0.0
    container_name: deal-aggregator-loki
    restart: always
    # No public port — Promtail pushes and Grafana queries over the internal network
    volumes:
      - ./loki/loki-config.yml:/etc/loki/loki-config.yml
      - loki-data:/loki
    command: -config.file=/etc/loki/loki-config.yml
    networks:
      - deal-network

  # ─── 9. Logging: Promtail (Log Collector/Agent) ───────────────────────────────
  promtail:
    image: grafana/promtail:3.0.0
    container_name: deal-aggregator-promtail
    restart: always
    volumes:
      - ./loki/promtail-config.yml:/etc/promtail/promtail-config.yml
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/promtail-config.yml
    depends_on:
      - loki
    networks:
      - deal-network

volumes:
  mongo-data:
  prometheus-data:
  grafana-data:
  loki-data:

networks:
  deal-network:
    driver: bridge
